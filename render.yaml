services:
  - type: web
    name: dip-api
    runtime: python
    rootDir: apps/api
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      # requirements.txt pins xgboost>=3.3.0, which requires Python >=3.12.
      # Pin explicitly rather than inheriting Render's default.
      - key: PYTHON_VERSION
        value: "3.12"
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
