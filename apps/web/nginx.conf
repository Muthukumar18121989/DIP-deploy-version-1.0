server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SPA fallback — same reason as vercel.json's rewrite: react-router
    # handles client-side routes like /use-cases/:id/dashboard, which don't
    # exist as real files, so unmatched paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
